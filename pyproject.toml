[project]
name = "voorbeeld"
version = "0.1.0"
description = "Add your description here"
dependencies = [
    "click>=8.1.7",
    "matplotlib>=3.7.5",
    "pathlib>=1.0.1",
    "toml>=0.10.2",
]
requires-python = ">= 3.8"

[project.scripts]
"visual" = "voorbeeld.main:visual"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voorbeeld"]
